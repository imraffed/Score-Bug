# Generate the Xcode project with:  brew install xcodegen && xcodegen
# The bundle ID also appears in Shared/SharedSettings.swift (App Group) and
# ExportOptions.plist; change all three together.
name: ScoreBug
options:
  bundleIdPrefix: com.jeffmchale
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: DXRJBMCTRX
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ScoreBug:
    type: application
    platform: iOS
    sources: [ScoreBug, Shared]
    dependencies:
      - target: ScoreBugWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffmchale.scorebug
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ScoreBug/Info.plist
      properties:
        CFBundleDisplayName: Score Bug
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Score Bug connects to your score server when it runs on your own network.
        CFBundleURLTypes:
          - CFBundleURLName: com.jeffmchale.scorebug
            CFBundleURLSchemes: [scorebug]
    entitlements:
      path: ScoreBug/ScoreBug.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.jeffmchale.scorebug]
  ScoreBugWidgets:
    type: app-extension
    platform: iOS
    sources: [ScoreBugWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffmchale.scorebug.widgets
    info:
      path: ScoreBugWidgets/Info.plist
      properties:
        CFBundleDisplayName: Score Bug
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: ScoreBugWidgets/ScoreBugWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jeffmchale.scorebug]
schemes:
  ScoreBug:
    build:
      targets:
        ScoreBug: all
    run:
      config: Debug
